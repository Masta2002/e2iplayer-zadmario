name: feed-build

# Builds the static helper binaries of the feed (see feed/SOURCES.md) and tests
# them on the target architecture. Only runs when the feed itself changes.

on:
  push:
    paths:
      - 'feed/**'
      - '.github/workflows/feed-*.yml'
  pull_request:
    paths:
      - 'feed/**'
      - '.github/workflows/feed-*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.plat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: armv7
            docker: linux/arm/v7
            strip: arm-linux-gnueabihf-strip
            binutils: binutils-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - name: Build and test in Alpine (${{ matrix.docker }})
        run: |
          . feed/sources.lock
          docker run --rm --platform ${{ matrix.docker }} -e PLAT=${{ matrix.plat }} \
              -v "$PWD:/w" -w /w "$ALPINE_IMAGE" sh feed/scripts/container.sh
          sudo chown -R "$(id -u):$(id -g)" out

      - name: curl-impersonate
        run: |
          sudo apt-get -q update
          sudo apt-get -y install upx-ucl ${{ matrix.binutils }}
          PLAT=${{ matrix.plat }} STRIP=${{ matrix.strip }} sh feed/scripts/build-curlimp.sh
          PLAT=${{ matrix.plat }} sh feed/scripts/test-curlimp.sh

      - name: SHA256SUMS, index.json
        run: PLAT=${{ matrix.plat }} sh feed/scripts/manifest.sh

      - uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.plat }}
          path: out/${{ matrix.plat }}
          if-no-files-found: error
