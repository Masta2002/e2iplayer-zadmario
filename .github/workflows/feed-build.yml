name: feed-build

# Builds the static helper binaries of the feed (see feed/SOURCES.md) and tests
# them on the target architecture. Only runs when the feed itself changes.

on:
  push:
    paths:
      - 'feed/**'
      - '.github/workflows/feed-*.yml'
  pull_request:
    paths:
      - 'feed/**'
      - '.github/workflows/feed-*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.plat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: armv7
            qemu: arm
    env:
      PLAT: ${{ matrix.plat }}
      WORK: ${{ github.workspace }}/../feed-work
    steps:
      - uses: actions/checkout@v7

      # runs the target binaries in the tests
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu }}

      # toolchain and source tarballs; everything in it is checked against sources.lock
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../feed-work/dl
          key: feed-dl-${{ matrix.plat }}-${{ hashFiles('feed/sources.lock') }}
          restore-keys: feed-dl-${{ matrix.plat }}-

      - name: Host tools
        run: |
          sudo apt-get -q update
          sudo apt-get -y install upx-ucl

      - name: Build and test
        run: sh feed/scripts/build-all.sh

      - uses: actions/upload-artifact@v7
        with:
          name: feed-${{ matrix.plat }}
          path: out/${{ matrix.plat }}
          if-no-files-found: error
